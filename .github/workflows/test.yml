name: CI

# Expertises 配下の Python スイートを検査する。paths を絞るのは、本リポの commit の
# 大半が Identities / ドキュメントであり、それらでテストを回す意味が無いため。
#
# 対象外: Expertises/{BlueberrySprite,ConsiderateCoder,GeneralConstructor,TelegramSecretary}
# は junction。BlueberrySprite は本リポに未追跡（正典は Homunculus-Weave-Private 側の CI）、
# ConsiderateCoder / TelegramSecretary は実体が commit されるが正典は plugins-weave 側で
# 検査済み。ここで二重に回さない。
#
# GeneralConstructor は 2026-08-25 の本尊化で junction 先が
# Homunculus-Weave-Private/GeneralConstructor/Public（拝殿）へ移り、pyproject も
# python/ も tests/ も本リポから見えなくなった。ジョブは Private 側の CI へ移設済み。
on:
  push:
    branches: [main]
    paths:
      - 'Expertises/NewsCaster/**'
      - 'Expertises/PrecognitiveViewer/**'
      - 'Expertises/CorporateStrategist/ForesightReader/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Expertises/NewsCaster/**'
      - 'Expertises/PrecognitiveViewer/**'
      - 'Expertises/CorporateStrategist/ForesightReader/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  # =============================================================================
  # NewsCaster
  # =============================================================================

  test-newscaster:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "Expertises/NewsCaster[dev]"

      # ルール・除外の SSoT は Expertises/NewsCaster/pyproject.toml の
      # [tool.ruff] / [tool.mypy]。ここでは呼ぶだけで、select や ignore を YAML に
      # 直書きしない。pytest より前に置くのは数秒で落ちるからで、落ちる理由が
      # 最も早く分かる順序にしてある。
      - name: Lint (ruff)
        working-directory: Expertises/NewsCaster
        run: python -m ruff check .

      # `--check` は書き換えず差分の有無だけを見る（CI が勝手にコードを直して
      # green にする経路は作らない）。
      - name: Format check (ruff)
        working-directory: Expertises/NewsCaster
        run: python -m ruff format --check .

      - name: Type check (mypy)
        working-directory: Expertises/NewsCaster
        run: python -m mypy scripts

      # 閾値は pyproject.toml [tool.coverage.report] fail_under = 70 が SSoT。
      - name: Run tests with coverage
        working-directory: Expertises/NewsCaster
        run: python -m pytest --cov -v

  # =============================================================================
  # PrecognitiveViewer
  # =============================================================================

  test-precognitiveviewer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # pyproject を持たない stdlib-only スイート（依存は pytest のみ）。
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # conftest.py が Expertises/ を sys.path に載せる。コピー元との SHA256 一致を見る
      # テストが Expertises/CorporateStrategist/ForesightReader を参照するため、
      # checkout 全体が必要（working-directory を切っても対象は相対解決される）。
      - name: Run tests
        working-directory: Expertises/PrecognitiveViewer
        run: python -m pytest -v
