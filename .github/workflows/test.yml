name: CI

# Expertises 配下の Python スイートを検査する。paths を絞るのは、本リポの commit の
# 大半が Identities / ドキュメントであり、それらでテストを回す意味が無いため。
#
# 対象外: Expertises/{BlueberrySprite,ConsiderateCoder,TelegramSecretary} は junction。
# BlueberrySprite は本リポに未追跡（正典は Homunculus-Weave-Private 側の CI）、
# ConsiderateCoder / TelegramSecretary は実体が commit されるが正典は plugins-weave 側で
# 検査済み。ここで二重に回さない。
on:
  push:
    branches: [main]
    paths:
      - 'Expertises/GeneralConstructor/**'
      - 'Expertises/NewsCaster/**'
      - 'Expertises/PrecognitiveViewer/**'
      - 'Expertises/CorporateStrategist/ForesightReader/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Expertises/GeneralConstructor/**'
      - 'Expertises/NewsCaster/**'
      - 'Expertises/PrecognitiveViewer/**'
      - 'Expertises/CorporateStrategist/ForesightReader/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  # =============================================================================
  # GeneralConstructor
  # =============================================================================

  test-generalconstructor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # pydantic は runtime 依存（採算計算のモデル定義）。未導入だと import 時に落ちる。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "Expertises/GeneralConstructor[dev]"

      - name: Run tests
        working-directory: Expertises/GeneralConstructor
        run: python -m pytest -v

  # =============================================================================
  # NewsCaster
  # =============================================================================

  test-newscaster:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "Expertises/NewsCaster[dev]"

      # 閾値は pyproject.toml [tool.coverage.report] fail_under = 70 が SSoT。
      - name: Run tests with coverage
        working-directory: Expertises/NewsCaster
        run: python -m pytest --cov -v

  # =============================================================================
  # PrecognitiveViewer
  # =============================================================================

  test-precognitiveviewer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # pyproject を持たない stdlib-only スイート（依存は pytest のみ）。
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # conftest.py が Expertises/ を sys.path に載せる。コピー元との SHA256 一致を見る
      # テストが Expertises/CorporateStrategist/ForesightReader を参照するため、
      # checkout 全体が必要（working-directory を切っても対象は相対解決される）。
      - name: Run tests
        working-directory: Expertises/PrecognitiveViewer
        run: python -m pytest -v
