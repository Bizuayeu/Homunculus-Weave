[project]
name = "newscaster"
version = "0.2.3"
description = "複数 RSS フィードの前日エントリを 0:10 JST に Gmail でメール配信するユーザスキル（フィード別ポリシーで装飾エッセイは Weave がベタ化）"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    # ドメイン層が JST 固定で動く（domain/date_range.py・domain/models.py・main.py の
    # ZoneInfo("Asia/Tokyo")）。zoneinfo は OS の tz データベースを見に行くため、
    # それを持たない環境（Windows、tzdata 抜きのスリムコンテナ）では import 時点で
    # ZoneInfoNotFoundError になる。開発機に偶然入っていることに依存しない。
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/tests/*", "scripts/main.py"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
